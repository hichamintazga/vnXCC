name: recon

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run = test, passive = recherche"
        type: choice
        default: passive
        options: [dry-run, passive]
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: recon
  cancel-in-progress: false

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TARGET: ${{ secrets.TARGET }}
      MODE: ${{ inputs.mode || 'passive' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Cache outils
        uses: actions/cache@v4
        with:
          path: |
            ~/go/bin
            ~/Tools
            ~/nuclei-templates
          key: ${{ runner.os }}-tools-v1

      - name: Restaurer résultats (pour --diff)
        uses: actions/cache/restore@v4
        with:
          path: Recon
          key: recon-${{ github.run_id }}
          restore-keys: recon-

      - name: Installer
        run: |
          chmod +x install.sh rvnxc.sh
          [ -x "$HOME/go/bin/subfinder" ] || ./install.sh
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Config
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          DISCORD: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          {
            echo "GITHUB_TOKEN=\"$GH_PAT\""
            echo "DISCORD_WEBHOOK=\"$DISCORD\""
          } > .env
          cp rvnxc.cfg ci.cfg
          sed -i 's/^WEBSCREENSHOT=.*/WEBSCREENSHOT=false/; s/^JSCHECKS=.*/JSCHECKS=false/; s/^URL_CHECK=.*/URL_CHECK=false/; s/^HTTPX_RATELIMIT=.*/HTTPX_RATELIMIT=150/' ci.cfg

      - name: Health check
        run: ./rvnxc.sh --health-check

      - name: Run
        run: |
          case "$MODE" in
            dry-run) ./rvnxc.sh -d "$TARGET" -p --dry-run -f ci.cfg ;;
            passive) timeout 300m ./rvnxc.sh -d "$TARGET" -p --diff -y -f ci.cfg || true ;;
          esac

      - name: Sauvegarder résultats (même si timeout)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: Recon
          key: recon-${{ github.run_id }}
